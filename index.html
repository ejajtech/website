<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050B09">
<title>ejajtech</title>
<style>
  :root {
    --accent: #C8F25A;
    --mint: #7FE0C3;
    --bg: #050B09;
    --bg-glow: #0C1A15;
    --line: #1F3A30;
    --line-2: #2A4A3E;
    --core: #0E1F1A;
    --speed: 1; /* set from main.js; higher = faster */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); }

  .stage {
    position: relative;
    height: 100vh;
    height: 100dvh;
    min-height: 480px;
    overflow: hidden;
    display: grid;
    place-items: center;
    background: radial-gradient(ellipse at 50% 50%, var(--bg-glow) 0%, var(--bg) 70%);
  }

  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(#1D3029 1px, transparent 1.6px);
    background-size: 28px 28px;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0%, transparent 72%);
            mask-image: radial-gradient(circle at 50% 50%, #000 0%, transparent 72%);
    animation: drift calc(6s / var(--speed)) linear infinite;
  }

  .glow {
    position: absolute;
    width: 60vmax; height: 60vmax; border-radius: 50%;
    background: radial-gradient(circle, var(--accent) 0%, transparent 62%);
    opacity: .07; filter: blur(40px);
    animation: wander calc(24s / var(--speed)) ease-in-out infinite;
  }

  .orb { position: relative; width: min(78vmin, 680px); aspect-ratio: 1 / 1; }
  .layer { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ring-1 { animation: spin calc(28s / var(--speed)) linear infinite; }
  .ring-2 { animation: spin calc(44s / var(--speed)) linear infinite reverse; }
  .ring-3 { animation: spin calc(90s / var(--speed)) linear infinite; }

  .polygon { animation: breathe 6s ease-in-out infinite; }
  .spokes  { animation: flow calc(1.6s / var(--speed)) linear infinite; }

  .node {
    position: absolute; width: 1.6%; height: 1.6%; border-radius: 50%;
    background: var(--c); box-shadow: 0 0 14px var(--c);
    animation: pulse calc(3s / var(--speed)) ease-in-out infinite;
  }

  .halo {
    position: absolute; left: 50%; top: 50%; width: 14%; height: 14%;
    border-radius: 50%; border: 1px solid var(--accent);
    animation: halo calc(4s / var(--speed)) ease-out infinite;
  }
  .halo + .halo { animation-delay: calc(2s / var(--speed)); }

  .core {
    position: absolute; left: 50%; top: 50%; width: 11%; height: 11%;
    border-radius: 22%; background: var(--core); border: 1px solid var(--line-2);
    box-shadow: 0 0 60px rgba(200, 242, 90, .18);
    display: grid; place-items: center;
    animation: core calc(8s / var(--speed)) ease-in-out infinite;
  }
  .core::after {
    content: ""; width: 34%; height: 34%; border-radius: 22%;
    background: var(--accent); box-shadow: 0 0 24px var(--accent);
  }

  @keyframes spin    { to { transform: rotate(360deg); } }
  @keyframes drift   { to { background-position: 28px 28px; } }
  @keyframes wander  { 0%,100% { transform: translate(-30%,-20%) scale(1); } 50% { transform: translate(20%,15%) scale(1.25); } }
  @keyframes pulse   { 0%,100% { transform: translate(-50%,-50%) scale(.6); opacity: .35; } 50% { transform: translate(-50%,-50%) scale(1.25); opacity: 1; } }
  @keyframes core    { 0%,100% { transform: translate(-50%,-50%) rotate(0); } 50% { transform: translate(-50%,-50%) rotate(45deg) scale(1.12); } }
  @keyframes halo    { from { transform: translate(-50%,-50%) scale(.4); opacity: .7; } to { transform: translate(-50%,-50%) scale(3.2); opacity: 0; } }
  @keyframes flow    { to { stroke-dashoffset: -16; } }
  @keyframes breathe { 0%,100% { opacity: .25; } 50% { opacity: .6; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>
<main class="stage" role="img" aria-label="ejajtech">
  <div class="dots"></div>
  <div class="glow"></div>

  <div class="orb">
    <svg class="layer ring-1" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="48" fill="none" stroke="var(--line)" stroke-width=".25"/>
      <circle cx="50" cy="50" r="48" fill="none" stroke="var(--accent)" stroke-width=".5"
              stroke-dasharray="18 132" stroke-linecap="round" opacity=".9"/>
    </svg>

    <svg class="layer ring-2" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="44" fill="none" stroke="var(--line-2)" stroke-width=".35"
              stroke-dasharray=".6 2.4" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="44" fill="none" stroke="var(--mint)" stroke-width=".4"
              stroke-dasharray="6 40 3 40" stroke-linecap="round" opacity=".7"/>
    </svg>

    <!-- Polygon, spokes and nodes are generated by main.js -->
    <svg id="network" class="layer ring-3" viewBox="0 0 100 100" aria-hidden="true"></svg>
    <div id="nodes" class="layer ring-3"></div>

    <span class="halo"></span>
    <span class="halo"></span>
    <span class="core"></span>
  </div>
</main>

<script src="main.js"></script>
</body>
</html>
